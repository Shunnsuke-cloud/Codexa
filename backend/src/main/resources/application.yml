spring:
  application:
    name: codexa-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codexa}
    username: ${SPRING_DATASOURCE_USERNAME:codexa}
    password: ${SPRING_DATASOURCE_PASSWORD:codexa_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:change_this_secret_key}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

server:
  port: 8080
